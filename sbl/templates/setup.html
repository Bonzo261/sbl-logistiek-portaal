{% extends "basis.html" %}{% block kop %}<style>header{display:none}</style>{% endblock %}{% block inhoud %}<img class="logo-groot" src="{{ url_for('static', filename='logo.svg') }}" alt="SBL – StemBureauLogistiek">
<h1>Eerste keer instellen</h1>
<form method="post" class="kaart"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
<p>Maak het eerste beheerdersaccount aan.</p>
<p><input name="naam" placeholder="Naam" required></p>
<p><input type="email" name="email" placeholder="E-mailadres (voor accountherstel, optioneel)" autocomplete="email"></p>
<p><input type="password" name="wachtwoord" placeholder="Wachtwoord (min. 10 tekens)" minlength="10" required></p>
<button>Aanmaken</button></form>{% endblock %}
